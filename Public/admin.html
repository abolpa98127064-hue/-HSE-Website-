<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت HSE</title>
<style>
:root{--bg:#071512;--card:#0d211c;--line:#21453a;--text:#effaf5;--muted:#abc2ba;--a:#42d3a1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1100px,92%);margin:auto}.top{padding:25px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.stat b{font-size:30px;color:var(--a)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{padding:10px 14px;border:1px solid var(--line);background:#102b24;color:#fff;border-radius:10px;cursor:pointer}.tab.active{background:var(--a);color:#062019}.hidden{display:none}.field{margin:10px 0}.field label{display:block;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#071512;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}.field textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{background:var(--a);border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:800;cursor:pointer}.danger{background:#6b2927;color:#fff}.secondary{background:#18372e;color:#fff}.item{border:1px solid var(--line);border-radius:12px;padding:15px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted)}#login{min-height:100vh;display:grid;place-items:center}.login{width:min(420px,92%);background:var(--card);border:1px solid var(--line);padding:28px;border-radius:20px}.error{color:#ffaaa4;min-height:24px}.notice{position:fixed;bottom:18px;left:18px;background:#164334;padding:10px 15px;border-radius:10px;display:none}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div id="login"><div class="login"><h1>ورود مدیریت HSE</h1><p class="muted">ایمیل مدیر و رمز عبور را وارد کنید.</p><div class="field"><label>ایمیل</label><input id="email" type="email"></div><div class="field"><label>رمز عبور</label><input id="password" type="password"></div><div class="error" id="loginError"></div><button class="btn" id="loginBtn">ورود</button><a class="btn secondary" href="/" style="display:inline-block">مشاهده سایت</a></div></div>

<div id="app" class="hidden"><div class="wrap">
<div class="top"><div><h1>پنل مدیریت HSE</h1><div class="muted">مدیریت محتوا، خدمات، پروژه‌ها، ابزارها و پیام‌ها</div></div><button class="btn secondary" id="logout">خروج</button></div>
<div class="grid"><div class="stat">بازدید<br><b id="visits">0</b></div><div class="stat">پیام خوانده‌نشده<br><b id="messages">0</b></div><div class="stat">خدمات<br><b id="services">0</b></div><div class="stat">ابزارهای HSE<br><b id="tools">0</b></div></div>
<div class="tabs"><button class="tab active" data-tab="settings">اطلاعات سایت</button><button class="tab" data-tab="content">محتوا</button><button class="tab" data-tab="messagesTab">پیام‌ها</button><button class="tab" data-tab="security">امنیت</button></div>
<section id="settings" class="panel"><h2>اطلاعات اصلی</h2><div id="settingsForm"></div><button class="btn" id="saveSettings">ذخیره اطلاعات</button></section>
<section id="content" class="panel hidden"><h2>مدیریت محتوا</h2><button class="btn" id="addContent">+ افزودن مورد</button><div id="contentList"></div></section>
<section id="messagesTab" class="panel hidden"><h2>پیام‌های دریافتی</h2><div id="messageList"></div></section>
<section id="security" class="panel hidden"><h2>تغییر رمز مدیریت</h2><div class="row"><div class="field"><label>رمز فعلی</label><input id="currentPassword" type="password"></div><div class="field"><label>رمز جدید</label><input id="newPassword" type="password"></div></div><button class="btn" id="changePassword">تغییر رمز</button><p class="muted">برای امنیت، رمز جدید باید حداقل ۱۰ کاراکتر باشد.</p></section>
</div></div><div class="notice" id="notice"></div>
<script>
let token=localStorage.getItem("hseAdminToken")||"";
const $=id=>document.getElementById(id);
function notice(t){$("notice").textContent=t;$("notice").style.display="block";setTimeout(()=>$("notice").style.display="none",1800)}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"};const r=await fetch(url,opt);if(r.status===401){logout();throw new Error("unauthorized")}const d=await r.json();if(!r.ok)throw new Error(d.error||"خطا");return d}
function logout(){localStorage.removeItem("hseAdminToken");token="";$("app").classList.add("hidden");$("login").classList.remove("hidden")}
$("loginBtn").onclick=async()=>{try{const d=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})}).then(async r=>{const x=await r.json();if(!r.ok)throw new Error(x.error);return x});token=d.token;localStorage.setItem("hseAdminToken",token);showApp()}catch(e){$("loginError").textContent=e.message}}
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});$("logout").onclick=logout;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));b.classList.add("active");$(b.dataset.tab).classList.remove("hidden")});
const settingKeys=["owner","title","tagline","heroText","aboutTitle","aboutSubtitle","about","approach","phone","email","location","servicesTitle","servicesSubtitle","projectsTitle","projectsSubtitle","detailsTitle","detailsSubtitle","certificatesTitle","certificatesSubtitle","contactTitle","contactSubtitle"];
async function loadSettings(){const d=await api("/api/site");const s=d.settings;$("settingsForm").innerHTML=settingKeys.map(k=>`<div class="field"><label>${k}</label>${k.includes("about")||k.includes("Text")||k.includes("Subtitle")||k==="approach"||k.includes("Title")?`<textarea data-setting="${k}">${esc(s[k]||"")}</textarea>`:`<input data-setting="${k}" value="${esc(s[k]||"")}">`}</div>`).join("")}
async function saveSettings(){const s={};document.querySelectorAll("[data-setting]").forEach(x=>s[x.dataset.setting]=x.value);await api("/api/admin/settings",{method:"PUT",body:JSON.stringify(s)});notice("اطلاعات ذخیره شد ✓")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function loadDashboard(){const d=await api("/api/admin/dashboard");$("visits").textContent=d.visits;$("messages").textContent=d.unreadMessages;$("services").textContent=d.services;$("tools").textContent=d.hseTools}
async function loadContent(){const a=await api("/api/admin/content");$("contentList").innerHTML=a.map(x=>`<div class="item" data-id="${x.id}"><div class="row"><div class="field"><label>نوع</label><select data-k="type"><option ${x.type==="service"?"selected":""} value="service">خدمت</option><option ${x.type==="project"?"selected":""} value="project">پروژه</option><option ${x.type==="detail"?"selected":""} value="detail">ابزار/شرح</option><option ${x.type==="certificate"?"selected":""} value="certificate">گواهینامه</option></select></div><div class="field"><label>عنوان</label><input data-k="title" value="${esc(x.title)}"></div></div><div class="field"><label>توضیح کوتاه</label><textarea data-k="short_text">${esc(x.short_text)}</textarea></div><div class="field"><label>توضیحات مفصل</label><textarea data-k="detail_text">${esc(x.detail_text)}</textarea></div><div class="actions"><button class="btn saveItem">ذخیره</button><button class="btn danger deleteItem">حذف</button></div></div>`).join("");document.querySelectorAll(".saveItem").forEach(b=>b.onclick=async()=>{const box=b.closest(".item"),id=box.dataset.id,o={};box.querySelectorAll("[data-k]").forEach(x=>o[x.dataset.k]=x.value);o.sort_order=0;await api("/api/admin/content/"+id,{method:"PUT",body:JSON.stringify(o)});notice("مورد ذخیره شد ✓");loadDashboard()});document.querySelectorAll(".deleteItem").forEach(b=>b.onclick=async()=>{if(confirm("این مورد حذف شود؟")){await api("/api/admin/content/"+b.closest(".item").dataset.id,{method:"DELETE"});loadContent();loadDashboard()}})}
$("addContent").onclick=async()=>{await api("/api/admin/content",{method:"POST",body:JSON.stringify({type:"service",title:"مورد جدید",short_text:"توضیح کوتاه",detail_text:"توضیحات مفصل"})});loadContent();loadDashboard()}
async function loadMessages(){const a=await api("/api/admin/messages");$("messageList").innerHTML=a.length?a.map(x=>`<div class="item"><b>${esc(x.name)}</b> — ${esc(x.phone)}<p>${esc(x.message)}</p><small>${new Date(x.created_at).toLocaleString("fa-IR")}</small>${x.read_at?"":" <button class='btn secondary markRead' data-id='"+x.id+"'>خوانده شد</button>"}</div>`).join(""):"<p class='muted'>پیامی ثبت نشده است.</p>";document.querySelectorAll(".markRead").forEach(b=>b.onclick=async()=>{await api("/api/admin/messages/"+b.dataset.id+"/read",{method:"PUT"});loadMessages();loadDashboard()})}
$("saveSettings").onclick=saveSettings;
$("changePassword").onclick=async()=>{try{await api("/api/admin/password",{method:"PUT",body:JSON.stringify({currentPassword:$("currentPassword").value,newPassword:$("newPassword").value})});notice("رمز تغییر کرد ✓");$("currentPassword").value=$("newPassword").value=""}catch(e){notice(e.message)}}
async function showApp(){ $("login").classList.add("hidden");$("app").classList.remove("hidden");try{await loadSettings();await loadContent();await loadMessages();await loadDashboard()}catch(e){logout()}}
if(token)showApp();
</script>
</body></html>
